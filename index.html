<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에이레 1066 — 먼스터의 소왕</title>
<link rel="stylesheet" href="style.css?v=108">
</head>
<body>

<div id="hdr">
  <div class="res">
    <span><b>금</b><span id="goldTxt">340</span><small id="goldInc" class="inc"></small></span>
    <span><b>위신</b><span id="prestigeTxt">120</span><small id="prestigeInc" class="inc"></small></span>
    <span><b>신앙도</b><span id="pietyTxt">0</span><small id="pietyInc" class="inc"></small></span>
    <span><b>정통성</b><span id="legitTxt">인정받은</span></span>
    <span><b>병력</b><span id="troopTxt">1,200</span></span>
    <span><b>직할</b><span id="domainTxt">2/6</span></span>
  </div>
</div>

<div id="main">
  <div id="mapWrap">
    <h3>에이레 — 일곱 왕국</h3>
    <svg id="map" viewBox="0 0 420 470" preserveAspectRatio="xMidYMid meet"></svg>
    <button id="baronyToggle" onclick="toggleBaronies()" title="남작령 표시 전환" style="position:absolute;top:6px;right:6px;font-size:.62rem;font-family:inherit;padding:2px 7px;border:1px solid var(--gold-dim);border-radius:3px;background:rgba(20,16,10,.8);color:var(--parch-dim);cursor:pointer;z-index:5">남작령</button>
    <button id="mapReset" onclick="resetMapView()" title="지도 원위치" style="position:absolute;top:6px;left:6px;font-size:.62rem;font-family:inherit;padding:2px 7px;border:1px solid var(--gold-dim);border-radius:3px;background:rgba(20,16,10,.8);color:var(--parch-dim);cursor:pointer;z-index:5">⤢ 원위치</button>
    <div id="actWidget" onclick="initAudio();togglePanel('act')" title="진행 중인 활동"></div>
    <div id="mapModes">
      <button class="mm on" data-m="dejure" onclick="setMapMode('dejure')" title="de jure 공작령 권역">권역</button>
      <button class="mm" data-m="realm" onclick="setMapMode('realm')" title="실제 지배 세력">실지배</button>
      <button class="mm" data-m="culture" onclick="setMapMode('culture')" title="카운티 문화">문화</button>
      <button class="mm" data-m="faith" onclick="setMapMode('faith')" title="지배자 신앙">신앙</button>
      <button class="mm" data-m="control" onclick="setMapMode('control')" title="장악력 (적=낮음·녹=높음)">장악력</button>
    </div>
  </div>
  <div id="logWrap" class="side-panel">
    <button class="panel-tab" id="logTab" title="연대기" onclick="initAudio();togglePanel('log')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 6c-2-1.4-5-1.4-7.5 0v12c2.5-1.4 5.5-1.4 7.5 0 2-1.4 5-1.4 7.5 0V6c-2.5-1.4-5.5-1.4-7.5 0z"/><line x1="12" y1="6" x2="12" y2="18"/></svg></button>
    <div class="panel-head">연대기<button class="panel-close" onclick="initAudio();togglePanel('log')">✕</button></div>
    <div id="log"></div>
  </div>
</div>

<div id="councilWrap" class="side-panel">
  <button class="panel-tab" id="councilTab" title="자문회" onclick="initAudio();togglePanel('council')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="4" r="1.5"/><circle cx="12" cy="20" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="20" cy="12" r="1.5"/></svg></button>
  <div class="panel-head">자문회<button class="panel-close" onclick="initAudio();closePanel('council')">✕</button></div>
  <div id="councilContent" class="panel-body"></div>
</div>
<div id="fiefWrap" class="side-panel">
  <button class="panel-tab" id="fiefTab" title="봉역" onclick="initAudio();togglePanel('fief')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 8l3 9h10l3-9-5 4-3-6-3 6-5-4z"/></svg></button>
  <div class="panel-head">봉역<button class="panel-close" onclick="initAudio();closePanel('fief')">✕</button></div>
  <div id="fiefContent" class="panel-body"></div>
</div>
<div id="actWrap" class="side-panel">
  <button class="panel-tab" id="actTab" title="활동" onclick="initAudio();togglePanel('act')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><line x1="7" y1="3" x2="7" y2="21"/><path d="M7 4.5h11l-3 4 3 4H7z"/></svg></button>
  <div class="panel-head">활동<button class="panel-close" onclick="initAudio();closePanel('act')">✕</button></div>
  <div id="actContent" class="panel-body"></div>
</div>
<div id="courtWrap" class="side-panel">
  <button class="panel-tab" id="courtTab" title="궁정신하" onclick="initAudio();togglePanel('court')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.3"/><path d="M3.5 19c0-2.8 2.2-4.7 5-4.7s5 1.9 5 4.7"/><path d="M15 19c.1-2.3 1.7-3.8 3.5-3.8 1.5 0 2.8 1 3.1 2.9"/></svg></button>
  <div class="panel-head">궁정신하<button class="panel-close" onclick="initAudio();closePanel('court')">✕</button></div>
  <div id="courtContent" class="panel-body"></div>
</div>
<div id="decWrap" class="side-panel">
  <button class="panel-tab" id="decTab" title="결단" onclick="initAudio();togglePanel('dec')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l9 9-9 9-9-9z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></button>
  <div class="panel-head">결단<button class="panel-close" onclick="initAudio();closePanel('dec')">✕</button></div>
  <div id="decContent" class="panel-body"></div>
</div>

<div id="warWrap" class="side-panel">
  <button class="panel-tab" id="warTab" title="군사" onclick="initAudio();togglePanel('war')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="5.5" y1="5.5" x2="18.5" y2="18.5"/><line x1="18.5" y1="5.5" x2="5.5" y2="18.5"/><line x1="3.5" y1="7" x2="7" y2="3.5"/><line x1="20.5" y1="7" x2="17" y2="3.5"/></svg></button>
  <div class="panel-head">군사<button class="panel-close" onclick="initAudio();closePanel('war')">✕</button></div>
  <div id="warContent" class="panel-body"></div>
</div>

<div id="intrigueWrap" class="side-panel">
  <button class="panel-tab" id="intrigueTab" title="계책" onclick="initAudio();togglePanel('intrigue')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2 9h-4z"/><line x1="8" y1="11" x2="16" y2="11"/><path d="M11 11h2v6l-1 2-1-2z"/></svg></button>
  <div class="panel-head">계책<button class="panel-close" onclick="initAudio();closePanel('intrigue')">✕</button></div>
  <div id="intrigueContent" class="panel-body"></div>
</div>
<div id="factionWrap" class="side-panel">
  <button class="panel-tab" id="factionTab" title="파벌" onclick="initAudio();togglePanel('faction')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="21" x2="5" y2="4"/><path d="M5 5h5l-1.5 2.3L10 10H5z"/><line x1="19" y1="21" x2="19" y2="4"/><path d="M19 5h-5l1.5 2.3L14 10h5z"/></svg></button>
  <div class="panel-head">파벌<button class="panel-close" onclick="initAudio();closePanel('faction')">✕</button></div>
  <div id="factionContent" class="panel-body"></div>
</div>
<div id="royalcourtWrap" class="side-panel">
  <button class="panel-tab" id="royalcourtTab" title="왕실궁정" onclick="initAudio();togglePanel('royalcourt')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9l8-5 8 5"/><line x1="6.5" y1="9.5" x2="6.5" y2="17.5"/><line x1="10" y1="9.5" x2="10" y2="17.5"/><line x1="14" y1="9.5" x2="14" y2="17.5"/><line x1="17.5" y1="9.5" x2="17.5" y2="17.5"/><line x1="4.5" y1="18" x2="19.5" y2="18"/></svg></button>
  <div class="panel-head">왕실궁정<button class="panel-close" onclick="initAudio();closePanel('royalcourt')">✕</button></div>
  <div id="royalcourtContent" class="panel-body"></div>
</div>
<div id="ftr">
  <div id="charCluster">
    <div id="portrait">M</div>
    <div id="charInfo">
      <div class="nm" id="cNm">무르하드 막 돈하드</div>
      <div class="ttl" id="cTtl">먼스터 소왕 · 39세 · 우어 브리언 가문</div>
      <div class="chips" id="cChips"></div>
      <div id="stats"></div>
      <div id="stressBox">
        <div class="lbl"><span>스트레스</span><span id="stressNum">0 / 150</span></div>
        <div id="stressTrack">
          <div id="stressFill"></div>
          <div class="smark" style="left:33.3%"></div>
          <div class="smark" style="left:66.6%"></div>
        </div>
        <div id="stressLvl">0단계 — 평온함</div>
      </div>
    </div>
  </div>
  <div class="ftr-ctrl">
    <div class="date"><span id="dateTxt">1066년 9월 15일</span><small id="seasonTxt">가을 · 먼스터</small></div>
    <button id="pauseBtn" onclick="initAudio();togglePause()">▶ 진행</button>
    <button class="spd" data-s="1" onclick="initAudio();setSpeed(1)">1배속</button>
    <button class="spd" data-s="2" onclick="initAudio();setSpeed(2)">2배속</button>
    <button class="spd" data-s="3" onclick="initAudio();setSpeed(3)">3배속</button>
  </div>
</div>

<div id="shade"><div class="modal" id="modalBox"></div></div>
<div id="profileShade"><div id="profileModal"></div></div>
<div id="actShade"><div id="actModal"></div></div>

<script src="script.js?v=135"></script>
</body>
</html>
